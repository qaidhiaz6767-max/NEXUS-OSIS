name: NEXUS core tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-security.txt
      - run: python -m compileall -q app.py core.py nexus tests
      - run: python -m unittest discover -s tests -v
      - name: Check browser module syntax
        run: for module in web/*.js; do node --check "$module"; done
      - run: node --test tests/frontend.test.mjs tests/executive.test.mjs
